name: Aggiorna Jarvis

on:
  schedule:
    # orari in UTC: 08:00, 10:00 e 06:00 in Italia con l'ora legale, un'ora prima con l'ora solare
    - cron: '0 6 * * 2'   # martedì, a giornata conclusa
    - cron: '0 8 * * 5'   # venerdì, prima degli anticipi della sera
    - cron: '0 4 * * 6'   # sabato, prima delle partite del pomeriggio
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 lxml

      - name: Scarica infortuni, probabili, orari e rendimento squadre
        run: python scripts/aggiorna.py
        continue-on-error: true

      - name: Salva i dati aggiornati
        run: |
          if [ -n "$(git status --porcelain dati/)" ]; then
            git config user.name  "Jarvis"
            git config user.email "jarvis@users.noreply.github.com"
            git add dati/
            git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "Nessuna variazione: niente da salvare."
          fi
