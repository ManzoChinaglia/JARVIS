name: Aggiorna Jarvis

on:
  schedule:
    # ogni giorno, dopo gli aggiornamenti delle probabili (11:30 e 19:30 in Italia),
    # così prima di qualunque scadenza, anche infrasettimanale, i dati sono freschi.
    # Orari in UTC: il giro della sera è doppio perché con l'ora legale e con quella
    # solare è un giro diverso a cadere dopo le 19:30 italiane.
    - cron: '45 10 * * *'   # 12:45 con l'ora legale, 11:45 con la solare
    - cron: '45 17 * * *'   # 19:45 con l'ora legale, 18:45 con la solare
    - cron: '45 18 * * *'   # 20:45 con l'ora legale, 19:45 con la solare
  workflow_dispatch:
    inputs:
      prova:
        description: 'Manda anche una notifica di prova'
        type: boolean
        default: false

# un giro alla volta: se GitHub ne ritarda uno (capita) non si accavalla col successivo
concurrency:
  group: aggiorna-jarvis
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ref: main = sempre l'ultimo commit, non quello del momento in cui il giro era stato
      # messo in coda (il 05/10/2026 un giro ritardato di 17 ore ripartì da dati vecchi e
      # andò in conflitto con quello già salvato)
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # il lucchetto (16/09/2026): i dati della lega nel repository sono chiusi a chiave;
      # si aprono per il giro e si richiudono prima del salvataggio. Senza dati/lucchetto.json
      # non fa niente. Se fallisce (password mancante) i dati pubblici si aggiornano lo stesso.
      - name: Apri il lucchetto
        env:
          JARVIS_CHIAVE: ${{ secrets.JARVIS_CHIAVE }}
        run: node scripts/lucchetto.js apri

      - uses: actions/setup-python@v7
        if: always()
        with:
          python-version: '3.14'

      - name: Installa dipendenze
        if: always()
        run: pip install requests beautifulsoup4 lxml

      - name: Scarica i dati e genera il calendario
        if: always()
        run: python scripts/aggiorna.py

      # le quote dei bookmaker (passo 4, 14/10/2026): quando una partita inizia entro 72 ore
      # si scaricano I1.csv e fixtures.csv di football-data.co.uk e si aggiorna dati/quote.json
      # (solo numeri ricavati). I CSV grezzi non possono stare in questo repository pubblico:
      # si conservano, con data e ora, nel repo privato JARVIS-conoscenza (segreto
      # CONOSCENZA_TOKEN, solo quel repo) e in un artefatto del giro; sul PC arrivano con un
      # git pull. Un guasto (rete, blocco del sito, token scaduto) non fa fallire il giro.
      - name: Prepara l'archivio privato delle quote
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ManzoChinaglia/JARVIS-conoscenza
          ref: master
          path: conoscenza
          token: ${{ secrets.CONOSCENZA_TOKEN }}

      - name: Scarica le quote
        if: always()
        env:
          QUOTE_ARCHIVIO: ${{ github.workspace }}/conoscenza/football-data
        run: |
          [ -d conoscenza/.git ] || { echo "::warning::archivio privato non disponibile (CONOSCENZA_TOKEN?): i CSV restano solo nell'artefatto."; export QUOTE_ARCHIVIO="$RUNNER_TEMP/football-data"; echo "QUOTE_ARCHIVIO=$QUOTE_ARCHIVIO" >> "$GITHUB_ENV"; }
          python scripts/quote.py --automatico

      # le news recenti per il fascicolo di «Ragiona con Jarvis» (22/10/2026): dall'archivio
      # privato solo data, tag e link per giocatore e squadra in dati/news.json. Mai titoli
      # né testi. Senza archivio (token) è solo un avviso.
      - name: News recenti per il fascicolo
        if: always()
        continue-on-error: true
        run: python scripts/aggiorna.py --news conoscenza/news

      - name: Conserva i CSV delle quote (artefatto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-csv
          path: |
            conoscenza/football-data/
            ${{ runner.temp }}/football-data/
          if-no-files-found: ignore
          retention-days: 90

      - name: Salva i CSV nell'archivio privato
        if: always()
        continue-on-error: true
        working-directory: conoscenza
        run: |
          if [ -d .git ] && [ -n "$(git status --porcelain football-data/)" ]; then
            git config user.name  "Jarvis"
            git config user.email "jarvis@users.noreply.github.com"
            git add football-data/
            git commit -m "Quote football-data $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase && git push || { sleep 5; git pull --rebase && git push; }
          else
            echo "Nessuna copia nuova da conservare."
          fi

      # il modello del fantavoto atteso (B2): si riaddestra con i voti nuovi, in Python
      # puro, in pochi secondi. Se il risultato non è plausibile resta il file di prima.
      - name: Aggiorna il modello del fantavoto
        if: always()
        run: python scripts/modello.py

      # gli avvisi nuovi arrivano sull'iPhone da Jarvis (Web Push) o, di riserva, con
      # ntfy. Iscrizione, chiave privata e argomento stanno nei Secrets di GitHub, mai
      # nel codice. Se web-push non si installa resta ntfy. Non fa mai fallire il giro.
      - name: Manda le notifiche
        if: always()
        env:
          NTFY_ARGOMENTO: ${{ secrets.NTFY_ARGOMENTO }}
          PUSH_ISCRIZIONE: ${{ secrets.PUSH_ISCRIZIONE }}
          PUSH_CHIAVE: ${{ secrets.PUSH_CHIAVE }}
          PROVA_NOTIFICHE: ${{ inputs.prova }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7 || echo "web-push non installato: solo ntfy"
          node scripts/notifiche.js

      # le copie in chiaro sono in .gitignore: nel commit vanno solo quelle chiuse
      - name: Richiudi il lucchetto
        if: always()
        env:
          JARVIS_CHIAVE: ${{ secrets.JARVIS_CHIAVE }}
        run: node scripts/lucchetto.js chiudi

      # si salva anche se una fonte è fallita: i dati buoni restano, ma il giro
      # risulta rosso su GitHub (che di norma avvisa per email). Se nel frattempo è
      # arrivato un altro commit, ci si allinea prima di spingere.
      - name: Salva i dati aggiornati
        if: always()
        run: |
          if [ -n "$(git status --porcelain dati/)" ]; then
            git config user.name  "Jarvis"
            git config user.email "jarvis@users.noreply.github.com"
            git add dati/
            git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase && git push || { sleep 5; git pull --rebase && git push; } || {
              # conflitto: nel frattempo è arrivato un salvataggio più recente. Non è un
              # errore: si lascia quello e il prossimo giro riparte da lì.
              git rebase --abort || true
              git reset --hard origin/main
              echo "::warning::Salvataggio saltato: dati già aggiornati da un altro giro."
            }
          else
            echo "Nessuna variazione: niente da salvare."
          fi
