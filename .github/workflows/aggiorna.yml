name: Aggiorna Jarvis

on:
  schedule:
    # ogni giorno, dopo gli aggiornamenti delle probabili (11:30 e 19:30 in Italia),
    # così prima di qualunque scadenza, anche infrasettimanale, i dati sono freschi.
    # Orari in UTC: il giro della sera è doppio perché con l'ora legale e con quella
    # solare è un giro diverso a cadere dopo le 19:30 italiane.
    - cron: '45 10 * * *'   # 12:45 con l'ora legale, 11:45 con la solare
    - cron: '45 17 * * *'   # 19:45 con l'ora legale, 18:45 con la solare
    - cron: '45 18 * * *'   # 20:45 con l'ora legale, 19:45 con la solare
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 lxml

      - name: Scarica i dati e genera il calendario
        run: python scripts/aggiorna.py

      # gli avvisi nuovi arrivano sull'iPhone con ntfy; l'argomento sta nei Secrets
      # di GitHub (NTFY_ARGOMENTO), mai nel codice. Non fa mai fallire il giro.
      - name: Manda le notifiche
        if: always()
        env:
          NTFY_ARGOMENTO: ${{ secrets.NTFY_ARGOMENTO }}
        run: node scripts/notifiche.js

      # si salva anche se una fonte è fallita: i dati buoni restano, ma il giro
      # risulta rosso su GitHub (che di norma avvisa per email)
      - name: Salva i dati aggiornati
        if: always()
        run: |
          if [ -n "$(git status --porcelain dati/)" ]; then
            git config user.name  "Jarvis"
            git config user.email "jarvis@users.noreply.github.com"
            git add dati/
            git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "Nessuna variazione: niente da salvare."
          fi
